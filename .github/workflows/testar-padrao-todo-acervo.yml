name: Validar padrão visual de todo o acervo
on:
  push:
    branches: [revisao/padrao-visual-todo-acervo-2026-10-31]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Conferir sete páginas em três telas
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bn-http.log 2>&1 &
          node scripts/testar-padrao-todo-acervo.cjs
      - name: Arquivar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-biblioteca-completa
          path: /tmp/bn-*.png
          if-no-files-found: ignore
