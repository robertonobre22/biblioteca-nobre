name: Verificações da Biblioteca
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar catálogo, links e arquivos
        run: node scripts/verificar-biblioteca.cjs
      - name: Verificar sintaxe JavaScript
        run: |
          find assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
