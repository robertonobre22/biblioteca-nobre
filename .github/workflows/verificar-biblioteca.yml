name: Verificações da Biblioteca
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar catálogo, links e arquivos
        run: node scripts/verificar-biblioteca.cjs
      - name: Testar preparação de substituição de capítulos
        run: node scripts/testar-substituicao.cjs
      - name: Testar protótipo Markdown com imagem
        run: node scripts/testar-livro-md.cjs
      - name: Testar revisão isolada de Markdown e imagens
        run: node scripts/testar-revisao-md.cjs
      - name: Testar prévia comparativa
        run: node scripts/testar-comparacao.cjs
      - name: Testar geração de prévia de revisão
        run: node scripts/testar-gerar-previa.cjs
      - name: Testar formatação literária Markdown
        run: node scripts/testar-formatacao-md.cjs
      - name: Testar componentes da paginação experimental
        run: node scripts/testar-paginacao.cjs
      - name: Verificar sintaxe JavaScript
        run: |
          find assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
