name: Teste visual do leitor experimental
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de testes
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Testar layout paginado no computador e celular
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bn-http.log 2>&1 &
          node scripts/testar-leitor-browser.cjs
