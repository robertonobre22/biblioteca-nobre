name: Validar nova capa experimental
on:
  push:
    branches: [revisao/nova-capa-biblioteca-2026-10-31]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Testar nova capa
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bn-capa.log 2>&1 &
          node scripts/testar-capa-biblioteca-v4.cjs
      - name: Salvar prévias visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previa-capa-biblioteca-v4
          path: /tmp/capa-biblioteca-*.png
          if-no-files-found: ignore
