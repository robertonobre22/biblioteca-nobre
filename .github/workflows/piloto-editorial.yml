name: Piloto editorial — conversão segura
on:
  pull_request:
    paths:
      - 'scripts/converter_docx.py'
      - 'scripts/test_converter_docx.py'
      - '.github/workflows/piloto-editorial.yml'
  workflow_dispatch:
    inputs:
      source_path:
        description: Caminho de arquivo DOCX já enviado à ramificação editorial
        type: string
        required: true
      expected_sha256:
        description: SHA-256 do arquivo original
        type: string
        required: true
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-docx==1.2.0
      - name: Teste automático com DOCX sintético
        run: python scripts/test_converter_docx.py
      - name: Validar entrada restrita
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE: ${{ inputs.source_path }}
          HASH: ${{ inputs.expected_sha256 }}
        run: |
          python - <<'PY'
          import hashlib,os,pathlib,re
          s=pathlib.Path(os.environ["SOURCE"])
          if s.is_absolute() or '..' in s.parts or s.suffix.lower()!='.docx' or not str(s).startswith('editorial/originais/'):
              raise SystemExit("Entrada fora de editorial/originais/")
          if not s.is_file():raise SystemExit("Arquivo não encontrado")
          actual=hashlib.sha256(s.read_bytes()).hexdigest()
          if not re.fullmatch(r'[0-9a-f]{64}',os.environ["HASH"]) or actual!=os.environ["HASH"]:
              raise SystemExit("SHA-256 diferente: conversão bloqueada")
          print('Integridade da origem verificada')
          PY
      - name: Converter sem alterar manuscrito
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE: ${{ inputs.source_path }}
        run: |
          python scripts/converter_docx.py "$SOURCE" --output saida-revisao --title "O Homem que Aprendeu a Forjar Silêncio" --id "o-homem-que-aprendeu-a-forjar-silencio"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: pre-edicao-darius
          path: saida-revisao/
          retention-days: 14
