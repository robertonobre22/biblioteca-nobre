name: Piloto editorial — teste seguro do conversor
on:
  pull_request:
    paths:
      - 'scripts/converter_docx.py'
      - 'scripts/test_converter_docx.py'
      - '.github/workflows/piloto-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-docx==1.2.0
      - name: Testar conversão com manuscrito fictício
        run: python scripts/test_converter_docx.py
# Segurança: repositório público. Não subir DOCX inéditos ou JSON com textos.
# A conversão real usa ambiente privado/offline e exige autorização editorial.
